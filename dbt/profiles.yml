xml_pipeline:
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | as_number }}"
      user: dbt
      database: iceberg
      schema: staging
      http_scheme: http
      threads: 4
