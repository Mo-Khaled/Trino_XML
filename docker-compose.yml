services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      APP_USER: ${ORACLE_APP_USER:?Set ORACLE_APP_USER in .env}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:?Set ORACLE_APP_PASSWORD in .env}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15

  trino:
    image: trinodb/trino:483
    container_name: trino
    depends_on:
      - oracle-xe
      - iceberg-rest
    ports:
      - "8080:8080"
    environment:
      ORACLE_APP_USER: ${ORACLE_APP_USER:?Set ORACLE_APP_USER in .env}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:?Set ORACLE_APP_PASSWORD in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./trino-catalog:/etc/trino/catalog

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >-
      /bin/sh -c
      "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/warehouse"

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH-STYLE-ACCESS: "true"
      # Default SQLite catalog has no busy_timeout, so any brief overlap on
      # its single connection fails immediately with SQLITE_BUSY instead of
      # waiting -- reproduced reliably on wide-schema (~290 column) table
      # commits. journal_mode=WAL lets reads and writes coexist instead of
      # blocking each other outright. Backed by a named volume (below) so a
      # container recreate no longer silently loses the catalog's table
      # registry -- previously this lived only in the container's ephemeral
      # writable layer.
      CATALOG_URI: "jdbc:sqlite:file:/var/iceberg-catalog/catalog.db?journal_mode=WAL&busy_timeout=30000"
    ports:
      - "8181:8181"
    volumes:
      - iceberg-catalog-data:/var/iceberg-catalog

volumes:
  oracle-data:
  minio-data:
  iceberg-catalog-data:
