services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      APP_USER: ${ORACLE_APP_USER:?Set ORACLE_APP_USER in .env}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:?Set ORACLE_APP_PASSWORD in .env}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15

  trino:
    image: trinodb/trino:483
    container_name: trino
    depends_on:
      - oracle-xe
    ports:
      - "8080:8080"
    environment:
      ORACLE_APP_USER: ${ORACLE_APP_USER:?Set ORACLE_APP_USER in .env}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:?Set ORACLE_APP_PASSWORD in .env}
    volumes:
      - ./trino-catalog:/etc/trino/catalog

volumes:
  oracle-data:
